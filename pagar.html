  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white: #ffffff; --pale: #f8fafd; --pale-d: #eef3fa; --sky: #cfe3d7;
      --celeste: #2e7d52; --celeste-d: #1f5c3a; --celeste-l: #e8f3ec;
      --navy: #0b2545; --ink: #0d1f33; --muted: #5a7490; --soft: #8ea2b5;

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    .nav-logo span { display: block; font-family: var(--sans); font-size: 9.5px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--celeste); margin-top: 3px; }
    .nav-back { font-size: 13px; font-weight: 600; color: var(--celeste-d); text-decoration: none; padding: 9px 18px; border: 1px solid var(--border); border-radius: 8px; transition: all .2s; }

    /* Header */

    .table-wrap { overflow-x: auto; margin: 1rem 0 1.2rem; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
    th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--pale); padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; color: #34485c; line-height: 1.55; }

    .rights { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin: 1rem 0 1.4rem; }

    .steps-list { counter-reset: st; list-style: none; margin: 0.6rem 0 1rem; }

    /* Footer */
    footer { background: var(--navy); color: #b9cadb; padding: 3rem 0 1.6rem; font-size: 13.5px; }
    .footer-inner { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 2.5rem; }

    footer ul { list-style: none; }
    footer li { margin-bottom: 0.45rem; }

    .footer-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-top: 2.4rem; padding-top: 1.3rem; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #8ea2b5; }

    @media (max-width: 1024px) {

    @media (max-width: 640px) {

      .table-wrap { border: none; overflow: visible; }
      table, tbody, tr, td { display: block; min-width: 0; width: 100%; }
      thead { display: none; }
      tr { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.6rem; padding: 0.8rem 0.95rem; background: var(--white); }

    .f input, .f select { width: 100%; font: inherit; font-size: 14.5px; color: var(--ink); background: var(--pale); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; }
    .f input:focus, .f select:focus { outline: none; border-color: var(--celeste); background: #fff; }

    .out .acts { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.8rem; }
    .out .acts a, .out .acts button { text-decoration: none; font: inherit; font-size: 14px; font-weight: 700; border-radius: 8px; padding: 11px 16px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--navy); }
    .out .acts .wa { background: #25d366; border-color: #25d366; color: #fff; }
    .ok-msg { font-size: 13px; color: #1f9d6b; margin-left: 0.4rem; }
    @media (max-width: 640px) { .g2 { grid-template-columns: 1fr; gap: 0; } .bill-top h1 { font-size: 26px; } .bill-total strong { font-size: 36px; } }

  <style>
    body.portal { background: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
    .pp-nav { background: #fff; border-bottom: 1px solid var(--border); padding: 18px 20px; text-align: center; }
    .pp-logo { display: inline-block; font-family: var(--serif); font-weight: 600; font-size: 24px; letter-spacing: 0.01em; line-height: 1.2; color: var(--ink); text-decoration: none; }
    .pp-logo em { font-style: normal; color: var(--celeste); }
    .pp-logo span { display: block; font-family: var(--sans); font-weight: 400; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--celeste); margin-top: 2px; }
    body.portal main { flex: 1; width: 100%; }
    footer.pp-foot { background: transparent; border-top: 1px solid var(--border); margin-top: 0; text-align: center; padding: 2rem 20px 2.4rem; color: var(--muted); font-size: 13px; line-height: 1.7; }
    footer.pp-foot .pp-logo { color: var(--ink); }
    footer.pp-foot .pp-logo span { color: var(--celeste); }
    .pp-foot .pp-logo { font-size: 20px; margin-bottom: 0.5rem; }
    .pp-foot p + p { margin-top: 0.2rem; }
    footer.pp-foot a { color: var(--navy); text-decoration: none; font-weight: 600; white-space: nowrap; }
    footer.pp-foot a:hover { color: var(--celeste-d); }
    .pp-foot .sep { opacity: .4; margin: 0 .5rem; }
  </style>
</head>
<body class="portal">

  <header class="pp-nav"><a href="https://www.exigetuseguro.cl/" class="pp-logo">exigetuseguro<em>.cl</em></a></header>

  <main class="wrap bill-wrap">
    <div class="bill" id="bill">
      <div class="bill-msg"><h1>Cargando su cobro…</h1></div>
    </div>
  </main>

  <footer class="pp-foot">
    <div class="pp-logo">exigetuseguro<em>.cl</em></div>
    <p>Abogados especialistas en seguros, con atención remota en todo Chile.</p>
    <p><a href="mailto:contacto@exigetuseguro.cl">contacto@exigetuseguro.cl</a><span class="sep">·</span><a href="https://wa.me/56979939868" target="_blank" rel="noopener">WhatsApp +56 9 7993 9868</a></p>
  </footer>

  <script>
    (function () {
      const c = new URLSearchParams(location.search).get('c');
      const bill = document.getElementById('bill');
      const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);
      const clp = n => '$' + Number(n).toLocaleString('es-CL');
      const fecha = d => new Date(d + 'T12:00:00').toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' });
      const WA = 'https://wa.me/56979939868?text=' + encodeURIComponent('Hola, necesito un enlace de pago.');
      const msg = (t, p) => { bill.innerHTML = '<div class="bill-msg"><h1>' + t + '</h1><p>' + p + '</p><a class="btn" href="' + WA + '" target="_blank" rel="noopener">Escribir por WhatsApp</a></div>'; };

      if (!c) { location.replace('/formas-de-pago'); return; }

      fetch('/api/cobro/ver?c=' + encodeURIComponent(c)).then(r => r.json()).then(d => {
        if (d.error) return msg('Enlace no válido', 'Este enlace de pago no es válido o fue modificado. Pídanos uno nuevo y se lo enviamos de inmediato.');
        if (d.estado === 'vencido') return msg('Este enlace venció', 'El enlace de pago del código <b>#' + esc(d.codigo) + '</b> venció el ' + fecha(d.expira) + '. Pídanos uno nuevo y se lo enviamos de inmediato.');
        const nombre = esc((d.nombre || '').trim().split(' ')[0]);
        bill.innerHTML = `
          <div class="bill-top">
            <h1>${nombre ? 'Hola, ' + nombre : 'Detalle de su pago'}</h1>
            <p>Revise el detalle y complete su pago.</p>
          </div>
          <div class="bill-body">
            <ul class="bill-rows">
              ${d.caso ? `<li><span>Caso</span><b>${esc(d.caso)}</b></li>` : ''}
              <li><span>Código</span><b>#${esc(d.codigo)}</b></li>
              <li><span>Concepto</span><b>${esc(d.concepto)}</b></li>
            </ul>
            <div class="bill-total"><span>Total a pagar</span><strong>${clp(d.monto)}</strong></div>
            <p class="bill-iva">IVA incluido</p>
            <div class="bill-mail">
              <label for="mail">Correo para su comprobante</label>
              <input id="mail" type="email" inputmode="email" autocomplete="email" maxlength="120" placeholder="nombre@correo.cl" value="${esc(d.email || '')}" required>
            </div>
            <button class="bill-btn" id="pay"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 10h19M6 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Pagar con tarjeta</span></button>
            <div class="err" id="err"></div>
            <p class="bill-foot"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V7.5a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/></svg> Pago seguro con Webpay de Transbank · Válido hasta el ${fecha(d.expira)}</p>
          </div>`;
        document.title = 'Pago #' + d.codigo + ' | Exige Tu Seguro';
        document.getElementById('mail').addEventListener('input', e => e.target.classList.remove('bad'));
        document.getElementById('pay').addEventListener('click', async () => {
          const btn = document.getElementById('pay'), err = document.getElementById('err'), mail = document.getElementById('mail');
          const email = mail.value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
            mail.classList.add('bad'); mail.focus();
            err.textContent = 'Ingrese un correo válido para enviarle el comprobante.'; err.style.display = 'block'; return;
          }
          mail.classList.remove('bad');
          btn.disabled = true; btn.querySelector('span').textContent = 'Conectando…'; err.style.display = 'none';
          try {
            const r = await fetch('/api/cobro/pagar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ c, email }) });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || !j.url) throw new Error(j.error || 'No pudimos iniciar el pago.');
            try { sessionStorage.setItem('ets_ultimo_cobro', location.href); } catch (e) {}
            location.href = j.url;
          } catch (x) {
            err.textContent = x.message + ' Si el problema continúa, escríbanos por WhatsApp.'; err.style.display = 'block';
            btn.disabled = false; btn.querySelector('span').textContent = 'Pagar con tarjeta';
          }
        });
      }).catch(() => msg('No pudimos cargar su cobro', 'Revise su conexión e intente nuevamente, o escríbanos por WhatsApp.'));
    })();
  </script>

</body>
</html>
