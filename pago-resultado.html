  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white: #ffffff; --pale: #f8fafd; --pale-d: #eef3fa; --sky: #cfe3d7;
      --celeste: #2e7d52; --celeste-d: #1f5c3a; --celeste-l: #e8f3ec;
      --navy: #0b2545; --ink: #0d1f33; --muted: #5a7490; --soft: #8ea2b5;
      --border: #dfe7f0; --ok: #1f9d6b; --warn: #b7791f; --warn-l: #fdf6e7;
      --radius: 10px; --maxw: 1180px; --nav-h: 72px;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Jost', system-ui, -apple-system, sans-serif;
    }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { background: var(--white); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.7; }
    a { color: var(--celeste-d); }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 2rem; }

    /* Top bar + nav */
    .topbar { background: var(--navy); color: #c9d8e6; font-size: 12px; }
    .topbar .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 36px; gap: 1rem; }
    .topbar a { color: #e3eef8; text-decoration: none; margin-left: 1.4rem; }
    .topbar a:hover { color: #fff; }
    nav.main { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    nav.main .wrap { display: flex; align-items: center; justify-content: space-between; height: var(--nav-h); }
    .nav-logo { font-family: var(--serif); font-size: 23px; font-weight: 600; color: var(--navy); text-decoration: none; line-height: 1.05; }
    .nav-logo em { font-style: normal; color: var(--celeste); }
    footer .nav-logo em { color: #8fd1aa; }
    .nav-logo span { display: block; font-family: var(--sans); font-size: 9.5px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--celeste); margin-top: 3px; }
    .nav-back { font-size: 13px; font-weight: 600; color: var(--celeste-d); text-decoration: none; padding: 9px 18px; border: 1px solid var(--border); border-radius: 8px; transition: all .2s; }
    .nav-back:hover { border-color: var(--celeste); background: var(--celeste-l); }

    /* Header */
    .page-head { background: linear-gradient(180deg, var(--pale) 0%, var(--white) 100%); border-bottom: 1px solid var(--border); padding: 3.5rem 0 3rem; }
    .crumbs { font-size: 12.5px; color: var(--soft); margin-bottom: 1.1rem; }
    .crumbs a { color: var(--muted); text-decoration: none; }
    .crumbs a:hover { color: var(--celeste-d); }
    .page-tag { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--celeste); margin-bottom: 0.9rem; }
    .page-tag::before { content: ''; width: 26px; height: 1.5px; background: var(--celeste); }
    h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(38px, 5vw, 56px); line-height: 1.05; color: var(--navy); letter-spacing: -0.01em; }

    .page-lead { max-width: 640px; margin-top: 1rem; font-size: 16px; color: var(--muted); }
    .page-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
    .chip { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--white); border: 1px solid var(--border); border-radius: 30px; padding: 5px 12px; }

    /* Resumen */
    .summary { margin-top: 2.5rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .sum-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.2rem 1.1rem; box-shadow: 0 2px 10px rgba(14,39,64,0.04); }

    .sum-card p { font-size: 13px; line-height: 1.55; color: var(--muted); }

    /* Layout */

    .layout > * { min-width: 0; }
    .toc { position: sticky; top: calc(var(--nav-h) + 1.5rem); }
    .toc-title { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); margin-bottom: 0.8rem; }
    .toc ol { list-style: none; counter-reset: toc; border-left: 1px solid var(--border); }
    .toc li { counter-increment: toc; }
    .toc a { display: flex; gap: 10px; padding: 6px 0 6px 14px; margin-left: -1px; border-left: 2px solid transparent; font-size: 13px; color: var(--muted); text-decoration: none; line-height: 1.4; transition: color .15s, border-color .15s; }
    .toc a::before { content: counter(toc, decimal-leading-zero); font-weight: 700; color: var(--soft); font-size: 11.5px; padding-top: 1px; }
    .toc a:hover { color: var(--celeste-d); }
    .toc a.active { color: var(--navy); font-weight: 600; border-left-color: var(--celeste); }
    .toc a.active::before { color: var(--celeste); }
    .toc-m { display: none; }

    /* Secciones */

    .policy ul { list-style: none; margin: 0.4rem 0 1rem; }
    .policy ul li { position: relative; padding-left: 1.4rem; margin-bottom: 0.5rem; color: #34485c; }
    .policy ul li::before { content: ''; position: absolute; left: 0.25rem; top: 0.68em; width: 6px; height: 6px; border-radius: 50%; background: var(--celeste); }
    .policy strong { color: var(--ink); font-weight: 600; }

    .note { background: var(--pale); border: 1px solid var(--border); border-left: 3px solid var(--celeste); border-radius: 8px; padding: 1rem 1.2rem; margin: 1.1rem 0; }
    .note p:last-child { margin-bottom: 0; }
    .note.warn { background: var(--warn-l); border-color: #f1dfb6; border-left-color: var(--warn); }
    .note-title { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--celeste-d); margin-bottom: 0.3rem; }
    .note.warn .note-title { color: var(--warn); }

    .table-wrap { overflow-x: auto; margin: 1rem 0 1.2rem; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
    th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--pale); padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; color: #34485c; line-height: 1.55; }
    tr:last-child td { border-bottom: none; }
    td:first-child { font-weight: 600; color: var(--ink); }
    .id-table { max-width: 520px; }
    .id-table table { min-width: 0; }
    .id-table td:first-child { width: 42%; color: var(--muted); font-weight: 600; }
    td small { display: block; color: var(--soft); font-size: 12px; margin-top: 2px; }

    .rights { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin: 1rem 0 1.4rem; }
    .right { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.95rem 1.1rem; background: var(--white); }
    .right strong { display: block; font-size: 14px; color: var(--navy); margin-bottom: 0.15rem; }
    .right span { font-size: 13px; color: var(--muted); line-height: 1.5; display: block; }
    .right .tag { display: inline-block; margin-top: 0.45rem; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--celeste-d); background: var(--celeste-l); border-radius: 4px; padding: 2px 6px; }

    .steps-list { counter-reset: st; list-style: none; margin: 0.6rem 0 1rem; }
    .steps-list li { counter-increment: st; position: relative; padding-left: 2.4rem; margin-bottom: 0.75rem; color: #34485c; }
    .steps-list li::before { content: counter(st); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }

    .contact-card { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin: 1rem 0; }
    .contact-card a, .contact-card div { display: block; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; text-decoration: none; background: var(--pale); }
    .contact-card a:hover { border-color: var(--celeste); }
    .contact-card small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft); margin-bottom: 0.2rem; }
    .contact-card span { font-size: 14px; font-weight: 600; color: var(--navy); word-break: break-word; }

    .version { margin-top: 2.4rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: center; font-size: 12.5px; color: var(--soft); padding-top: 1.4rem; border-top: 1px solid var(--border); }
    .version a { font-weight: 600; text-decoration: none; }

    /* Footer */
    footer { background: var(--navy); color: #b9cadb; padding: 3rem 0 1.6rem; font-size: 13.5px; }
    .footer-inner { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 2.5rem; }
    footer .nav-logo { color: #fff; }
    footer .nav-logo span { color: #8fd1aa; }
    .footer-brand p { margin-top: 0.9rem; max-width: 290px; line-height: 1.6; color: #9fb3c7; }
    footer h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #fff; margin-bottom: 0.9rem; }
    footer ul { list-style: none; }
    footer li { margin-bottom: 0.45rem; }
    footer a { color: #b9cadb; text-decoration: none; }
    footer a:hover { color: #fff; }
    .footer-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-top: 2.4rem; padding-top: 1.3rem; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #8ea2b5; }

    @media (max-width: 1024px) {

      .toc { display: none; }

      .toc-m summary { cursor: pointer; list-style: none; padding: 0.9rem 1.1rem; font-size: 13.5px; font-weight: 700; color: var(--navy); display: flex; justify-content: space-between; }
      .toc-m summary::-webkit-details-marker { display: none; }
      .toc-m summary::after { content: '+'; color: var(--celeste); font-size: 18px; line-height: 1; }
      .toc-m[open] summary::after { content: '–'; }
      .toc-m ol { margin: 0 1.1rem 1rem 2.3rem; font-size: 13.5px; }
      .toc-m li { margin-bottom: 0.35rem; }
      .toc-m a { text-decoration: none; }
      .footer-inner { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      body { font-size: 14.5px; }
      .wrap { padding: 0 16px; }

      .topbar a { margin: 0 0.6rem; }
      .nav-logo { font-size: 20px; }
      .nav-back { font-size: 12px; padding: 7px 12px; }
      .page-head { padding: 2.2rem 0 2rem; }
      .summary { grid-template-columns: 1fr; gap: 0.6rem; margin-top: 1.6rem; }
      .sum-card { display: grid; grid-template-columns: 38px 1fr; gap: 0 0.9rem; padding: 0.9rem 1rem; }
      .sum-ico { margin-bottom: 0; grid-row: span 2; }
      .rights, .contact-card { grid-template-columns: 1fr; }
      .table-wrap { border: none; overflow: visible; }
      table, tbody, tr, td { display: block; min-width: 0; width: 100%; }
      thead { display: none; }
      tr { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.6rem; padding: 0.8rem 0.95rem; background: var(--white); }
      td { border: none; padding: 0; }
      td:first-child { color: var(--navy); margin-bottom: 0.25rem; }
      td small { display: inline; margin-left: 0.4rem; }
      .footer-inner { grid-template-columns: 1fr; gap: 1.6rem; }
    }
    @media print {
      .topbar, nav.main, .toc, .toc-m, footer, .nav-back { display: none !important; }
      .layout { grid-template-columns: 1fr; padding: 1rem 0; }
      .page-head { background: none; padding: 1rem 0; }
      .summary { grid-template-columns: repeat(2, 1fr); }
    }
